filebeat.modules:
  - module: nginx
    access:
      enabled: true
      var.paths: ["/var/log/nginx/file_access.log*"]
    error:
      enabled: true
      var.paths: ["/var/log/nginx/file_error.log*"]

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "http://kibana:5601"

# Автоматическая загрузка ingest-пайплайнов, шаблонов и дашбордов для Nginx
setup.dashboards.enabled: true


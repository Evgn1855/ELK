version: '3.9'

services:
  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - cluster.name=my_cluster
      - xpack.security.enabled=false
      - discovery.type=single-node
    ports:
      - 9200:9200
  kibana:
    image: kibana:8.12.2
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
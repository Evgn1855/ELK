log_format json_logs escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"user_agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name localhost;

    # Пишем в реальные файлы в /var/log/nginx/ (а не в симлинки stdout/stderr)
    access_log /var/log/nginx/file_access.log combined;
    error_log  /var/log/nginx/file_error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}